for(let i=0;i<20;i++)h+=`<span style="left:${Math.random()*96}%;top:${Math.random()*92}%;font-size:${20+Math.random()*34}px;animation-delay:-${Math.random()*9}s">${D[i%D.length]}</span>`;
$('#bg').innerHTML=h})();

/* seed + auth */
(function(){const a=users();if(!a.some(x=>x.u.toLowerCase()=='xyann'))a.push({u:'Xyann',p:'RESTO',r:'admin',seen:false,bal:BAL});a.forEach(x=>{if(typeof x.bal!='number')x.bal=BAL});sv('yi_users',a)})();
function authUI(){const r=mode=='reg';
 $('#at').textContent=r?'Create an account':'Log in';
 $('#as').innerHTML=r?'Already have an account? <button type="button" class="lnk" data-a="authtab" data-v="login">Log in</button>':'New here? <button type="button" class="lnk" data-a="authtab" data-v="reg">Create an account</button>';
 $('#agr').hidden=!r;$('#sb').textContent=r?'Create account':'Log in';$('#err').textContent='';
 $('#p').autocomplete=r?'new-password':'current-password'}
authUI();
$('#af').onsubmit=e=>{e.preventDefault();const u=$('#u').value.trim(),p=$('#p').value,a=users(),er=$('#err');er.textContent='';
 if(mode=='reg'){
  if(u.length<3){er.textContent='Username needs at least 3 characters.';return}
  if(p.length<4){er.textContent='Password needs at least 4 characters.';return}
  if(!$('#ag').checked){er.textContent='Tick the box to accept the terms.';return}
  if(a.some(x=>x.u.toLowerCase()==u.toLowerCase())){er.textContent='That username is taken. Pick another one.';return}
  a.push({u,p,r:'customer',seen:false,bal:BAL});sv('yi_users',a);mode='login';authUI();$('#u').value=u;$('#p').value='';note('Account created. Log in to continue.');
 }else{
  const x=a.find(x=>x.u.toLowerCase()==u.toLowerCase()&&x.p===p);
  if(!x){er.textContent='Wrong username or password.';return}
  const first=!x.seen;x.seen=true;sv('yi_users',a);enter(x);note((first?'Welcome, ':'Welcome back, ')+x.u+'.');
 }};
function enter(x){S.u=x;sv('yi_sess',x.u);S.cart=ld('yi_cart_'+x.u,{});S.tab={customer:'shop',cashier:'orders',admin:'dash'}[x.r];
 $('#auth').hidden=true;$('#app').hidden=false;$('#af').reset();go();scrollTo(0,0)}
function leave(){S.k++;S.u=null;sv('yi_sess','');$('#app').hidden=true;$('#auth').hidden=false;mode='login';authUI()}

/* toast */
function note(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),3400)}

/* nav */
function tabs(){const r=S.u.r;
 if(r=='customer')return[['shop','🛍️','Shop','c'],['hot','🔥','Hot','c'],['cart','🧺','Basket','c',1],['orders','🧾','My orders','c'],['me','👤','Profile','a']];
 if(r=='cashier')return[['prod','📦','Products','c'],['orders','🧾','Orders','c',1],['me','👤','Profile','a']];
 return[['dash','📊','Dashboard','c'],['orders','🧾','Orders','c'],['prod','📦','Products','c',1],['users','👥','Users','c'],['me','👤','Profile','a']]}
const cartN=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
function nav(){const T=tabs(),n=cartN();
 const bd=t=>t[0]=='cart'&&n?`<span class="bdg">${n}</span>`:'';
 const item=t=>`<button class="ni ${S.tab==t[0]?'on':''}" data-a="tab" data-v="${t[0]}"><i>${t[1]}</i><span>${t[2]}</span>${bd(t)}</button>`;
 const grp=(l,g)=>`<p class="gl">${l}</p>`+T.filter(t=>t[3]==g).map(item).join('');
 $('#side').innerHTML=`<div class="brand">${logo(40)}<b class="ttl">Yann’s ItemS</b></div>`+grp('Content','c')+grp('Administrative','a')+`<button class="ni out" data-a="logout"><i>🚪</i><span>Log out</span></button><div class="prof">${logo(38)}<div><b>${esc(S.u.u)}</b><small>${S.u.r}</small><br><small>${rp(S.u.bal)}</small></div></div>`;
 $('#bot').innerHTML=T.map(t=>`<button class="bn ${t[4]?'ctr':''} ${S.tab==t[0]?'on':''}" data-a="tab" data-v="${t[0]}" aria-label="${t[2]}"><i>${t[1]}</i><span>${t[2].replace('My orders','Orders')}</span>${bd(t)}</button>`).join('')}
function skel(){return `<div class='sk' style='height:34px;width:200px;margin-bottom:10px'></div><div class='sk' style='height:16px;width:300px;max-width:100%;margin-bottom:22px'></div><div class='grid'>${`<div class='sk' style='height:230px;border-radius:18px'></div>`.repeat(8)}</div>`}
function extra(){const o=$('#side .out');if(o)o.insertAdjacentHTML('beforebegin',`<p class='gl'>Support</p>`+[['feedback','💬','Feedback'],['help','🛟','Help']].map(t=>`<button class='ni ${S.tab==t[0]?'on':''}' data-a='tab' data-v='${t[0]}'><i>${t[1]}</i><span>${t[2]}</span></button>`).join(''));
 $('#top').innerHTML=`<button class='hb' data-a='menu' aria-label='Open menu'>☰</button>${logo(30)}<b class='ttl'>Yann’s ItemS</b><span class='chip' style='margin-left:auto'>${rp(S.u.bal)}</span>`}
function render(){S.k++;nav();extra();$('#view').innerHTML=V[S.tab]()}
function go(){nav();extra();const t=++S.k;$('#view').innerHTML=skel();setTimeout(()=>{if(S.k==t)$('#view').innerHTML=V[S.tab]()},450)}
function closeMenu(){$('#side').classList.remove('open');$('#scrim').classList.remove('on')}
function mail(s,b){const a=document.createElement('a');a.href='mailto:'+TO+'?subject='+encodeURIComponent(s)+'&body='+encodeURIComponent(b);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}

/* views */
const card=p=>`<article class="pc"><div class="pe" style="--c:${COL[p.id%4]}">${esc(p.e)}${p.h?'<em>HOT</em>':''}</div><h3>${esc(p.n)}</h3><small>${esc(p.c)}</small><div class="pr"><b>${rp(p.p)}</b>${S.u.r=='customer'?`<button class="add" data-a="add" data-v="${p.id}" aria-label="Add ${esc(p.n)} to basket">+</button>`:''}</div></article>`;
const pill=s=>`<span class="pill s${s}">${ST[s]}</span>`;
const empty=(e,t)=>`<div class="empty"><b>${e}</b>${t}</div>`;
const V={
shop(){const P=prods(),cats=['All',...new Set(P.map(p=>p.c))],L=P.filter(p=>S.f=='All'||p.c==S.f);
 const tk='🎮 Free sticker with every order ✦ ⌨️ New keycaps just landed ✦ 🔌 USB hubs on the shelf ✦ 🔘 Arcade buttons by the piece ✦ ';
 return `<div class="hero"><h1 class="ttl">Yann’s ItemS</h1><p>Gamer gear for your desk: keyboards, USB, buttons and more. Add to basket, order, pick up.</p><span class="bigemo" aria-hidden="true">🎮</span></div>
 <div class="tick" aria-hidden="true"><span class="tr">${tk.repeat(4)}</span></div>
 <div class="chips">${cats.map(c=>`<button class="chip ${S.f==c?'on':''}" data-a="filter" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>
 <div class="grid">${L.map(card).join('')}</div>`},
hot(){const L=prods().filter(p=>p.h);return `<h2 class="pt">Hot right now 🔥</h2><p class="sub2">What other gamers are grabbing.</p>${L.length?`<div class="grid">${L.map(card).join('')}</div>`:empty('🔥','No hot items yet.')}`},
cart(){const P=prods(),ids=Object.keys(S.cart).filter(i=>S.cart[i]>0),L=ids.map(i=>({p:P.find(x=>x.id==i),q:S.cart[i]})).filter(x=>x.p),t=L.reduce((a,x)=>a+x.p.p*x.q,0);
 if(!L.length)return `<h2 class="pt">Your basket</h2>${empty('🧺','Nothing here yet. Add something from the shop.')}<p style="text-align:center"><button class="btn" data-a="tab" data-v="shop">Browse items</button></p>`;
 return `<h2 class="pt">Your basket</h2><p class="sub2">${cartN()} item(s) ready to order. Balance: ${rp(S.u.bal)}.</p><div class="pan">${L.map(x=>`<div class="row"><span style="font-size:30px">${esc(x.p.e)}</span><div class="g"><b>${esc(x.p.n)}</b><br><small>${rp(x.p.p)}</small></div><div class="qty"><button data-a="dec" data-v="${x.p.id}" aria-label="Remove one">−</button><b>${x.q}</b><button data-a="inc" data-v="${x.p.id}" aria-label="Add one">+</button></div></div>`).join('')}<div class="tot"><span>Total</span><span>${rp(t)}</span></div>
 <input class="inp" id="tb" placeholder="Table number or pickup name" maxlength="40"><button class="btn" data-a="place" style="width:100%">Place order</button></div>`},
orders(){const c=S.u.r=='customer',L=orders().filter(o=>!c||o.user==S.u.u).reverse(),st=!c;
 return `<h2 class="pt">${c?'My orders':'All orders'}</h2><p class="sub2">${c?'Follow your order from the counter to your hands.':'Move each order forward as it gets prepared.'}</p>`+
 (L.length?L.map(o=>`<div class="pan"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${esc(o.id)} · ${esc(o.note||'-')}</b>${pill(o.s)}</div><small style="color:var(--mut)">${esc(o.user)} · ${new Date(o.t).toLocaleString()}</small><div class="steps">${ST.map((_,i)=>`<i style="${i<=o.s?'background:'+COL[i]:''}"></i>`).join('')}</div>${o.items.map(i=>`<div>${esc(i.e)} ${esc(i.n)} × ${i.q}</div>`).join('')}<div class="tot" style="font-size:17px"><span>Total</span><span>${rp(o.total)}</span></div>${st&&o.s<3?`<button class="btn" data-a="adv" data-v="${esc(o.id)}">Mark as ${ST[o.s+1]}</button>`:''}</div>`).join(''):empty('🧾',c?'No orders yet. Your first one is a few taps away.':'No orders yet. New ones show up here.'))},
dash(){const O=orders(),rev=O.filter(o=>o.s==3).reduce((a,o)=>a+o.total,0),cu=users().filter(u=>u.r=='customer').length,cn=ST.map((_,i)=>O.filter(o=>o.s==i).length),tp={};
 O.forEach(o=>o.items.forEach(i=>tp[i.n]=(tp[i.n]||0)+i.q));const top=Object.entries(tp).sort((a,b)=>b[1]-a[1]).slice(0,5),mx=Math.max(1,...cn);
 return `<h2 class="pt">Dashboard</h2><p class="sub2">Every order and customer at a glance.</p>
 <div class="stats"><div class="stat" style="background:#ee6a4d33"><b>${rp(rev)}</b><span>Revenue (done orders)</span></div><div class="stat" style="background:#4cb0ee33"><b>${O.length}</b><span>Total orders</span></div><div class="stat" style="background:#dc72b833"><b>${O.length-cn[3]}</b><span>In progress</span></div><div class="stat" style="background:#97cd5e33"><b>${cu}</b><span>Customers</span></div></div>
 <div class="two"><div class="pan"><b>Order progress</b>${ST.map((s,i)=>`<div class="bar"><span style="width:84px">${s}</span><u><s style="width:${cn[i]/mx*100}%;background:${COL[i]}"></s></u><b>${cn[i]}</b></div>`).join('')}</div>
 <div class="pan"><b>Best sellers</b>${top.length?top.map(t=>`<div class="row"><div class="g">${esc(t[0])}</div><b>× ${t[1]}</b></div>`).join(''):empty('🏆','Best sellers appear after the first order.')}</div></div>`},
users(){return `<h2 class="pt">Users</h2><p class="sub2">All registered accounts.</p><div class="pan"><b>Add an account</b><br><br><input class="inp" id="nu" placeholder="Username" autocomplete="off"><input class="inp" id="np" type="text" placeholder="Password" autocomplete="off"><select class="inp" id="nr" aria-label="Account type"><option value="customer">Customer</option><option value="cashier">Cashier</option><option value="admin">Admin</option></select><button class="btn" data-a="addu">Add account</button></div><div class="pan">${users().map(u=>`<div class="row">${logo(34)}<div class="g"><b>${esc(u.u)}</b><br><small>${u.seen?'Has logged in':'Never logged in'} · ${rp(u.bal)}</small></div>${u.u=='Xyann'?'<span title="Protected account" aria-label="Protected account">🔒</span>':S.u.u=='Xyann'?`<button class="btn alt" data-a="delu" data-v="${esc(u.u)}">${S.del==u.u?'Tap again to confirm':'Delete'}</button>`:''}<span class="pill s${u.r=='admin'?0:u.r=='cashier'?1:2}">${u.r}</span></div>`).join('')}</div>`},
prod(){const a=S.u.r=='admin',P=prods();
 return `<h2 class="pt">Products</h2><p class="sub2">${P.length} items in the shop.</p>${a?`<div class="pan"><b>Add a product</b><br><br><input class="inp" id="pn" placeholder="Name"><input class="inp" id="pp" type="number" min="0" placeholder="Price (Rp)"><input class="inp" id="pe" placeholder="Emoji, e.g. 🎧" maxlength="4"><input class="inp" id="pc" placeholder="Category"><button class="btn" data-a="addp">Add product</button></div>`:''}<div class="pan">${P.map(p=>`<div class="row"><span style="font-size:30px">${esc(p.e)}</span><div class="g"><b>${esc(p.n)}</b><br><small>${esc(p.c)} · ${rp(p.p)}</small></div><input class="inp pi" id="pr${p.id}" type="number" min="0" value="${p.p}" aria-label="Price of ${esc(p.n)}"><button class="btn" data-a="savep" data-v="${p.id}">Save</button>${a?`<button class="btn alt" data-a="delp" data-v="${p.id}" aria-label="Delete ${esc(p.n)}">Delete</button>`:''}</div>`).join('')}</div>`},
feedback(){const f=S.fb;return `<h2 class='pt'>Feedback</h2><p class='sub2'>Tell us what you think. It goes straight to our inbox.</p><div class='pan'><b>What do you think of Yann’s ItemS?</b><div class='thumbs'><button class='th ${f.t==1?'on':''}' data-a='thumb' data-v='1' aria-label='Thumbs up'>👍</button><button class='th ${f.t==-1?'on':''}' data-a='thumb' data-v='-1' aria-label='Thumbs down'>👎</button></div><b>How satisfied are you with this experience?</b><div class='stars'>${[1,2,3,4,5].map(i=>`<button class='st ${i<=f.s?'on':''}' data-a='star' data-v='${i}' aria-label='${i} star'>★</button>`).join('')}</div><b>How can we improve? <small style='color:var(--mut)'>optional</small></b><textarea class='inp' id='ft' rows='5' maxlength='1000' placeholder='Write your suggestion' style='margin-top:8px'>${esc(f.x)}</textarea><small id='fc' style='color:var(--mut);display:block;text-align:right;margin-bottom:12px'>${f.x.length}/1000</small><b>Your email <small style='color:var(--mut)'>optional, if you want a reply</small></b><input class='inp' id='fe' type='email' placeholder='you@example.com' autocomplete='email' value='${esc(f.e||'')}' style='margin-top:8px'><button class='btn' data-a='sendfb' style='width:100%'>Send</button><p class='hint'>Your message goes straight to our inbox. If you left your email, we will reply there.</p></div>`},
help(){return `<h2 class='pt'>Help</h2><p class='sub2'>Confused or unsure about something? Tell us your email and your question.</p><div class='pan'><b>Your email address</b><input class='inp' id='he' type='email' placeholder='you@example.com' autocomplete='email' value='${esc(S.he||'')}' style='margin-top:8px'><b>What do you need help with?</b><textarea class='inp' id='hq' rows='5' maxlength='1000' placeholder='Describe your question' style='margin-top:8px'>${esc(S.hq||'')}</textarea><button class='btn' data-a='sendhelp' style='width:100%'>Send</button><p class='note'>Please wait for a response to your email.</p><p class='hint'>Your question goes straight to our inbox. If sending fails, your email app opens with a draft instead.</p></div>`},
me(){const n=orders().filter(o=>o.user==S.u.u).length;
 return `<div class="me pan">${logo(96)}<h2 class="pt" style="margin-top:14px">${esc(S.u.u)}</h2><span class="pill s1">${S.u.r}</span><p class="sub2">${S.u.r=='customer'?n+' order(s) placed.':'Signed in as staff.'}</p><div class="stat" style="background:#97cd5e33;margin-bottom:14px"><b>${rp(S.u.bal)}</b><span>Balance</span></div><button class="btn alt" data-a="logout">Log out</button></div><div class="pan" style="max-width:380px;margin:0 auto"><b>Settings: change password</b><br><br><input class="inp" id="cp" type="password" placeholder="Current password" autocomplete="current-password"><input class="inp" id="np1" type="password" placeholder="New password (min. 4 characters)" autocomplete="new-password"><input class="inp" id="np2" type="password" placeholder="Repeat new password" autocomplete="new-password"><button class="btn" data-a="chpw" style="width:100%">Save password</button></div>${S.u.u=='Xyann'?'':`<div class="pan" style="max-width:380px;margin:14px auto"><b>Delete account</b><p class="sub2">This removes your account for good. Your past orders stay in the shop records.</p><input class="inp" id="dp" type="password" placeholder="Enter your password to confirm" autocomplete="current-password"><button class="btn alt" data-a="delme" style="width:100%">Delete my account</button></div>`}`}};

/* actions */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,cs=()=>sv('yi_cart_'+S.u.u,S.cart);
 if(a=='authtab'){mode=v;authUI()}
 else if(a=='togpw'){const p=$('#p');p.type=p.type=='password'?'text':'password'}
 else if(a=='logout'){closeMenu();$('#dlg').hidden=false;$('#dlgok').focus()}
 else if(a=='logoutno'){$('#dlg').hidden=true}
 else if(a=='logoutok'){$('#dlg').hidden=true;leave()}
 else if(a=='menu'){$('#side').classList.toggle('open');$('#scrim').classList.toggle('on')}
 else if(a=='tab'){S.del=null;S.tab=v;closeMenu();go();scrollTo(0,0)}
 else if(a=='filter'){S.f=v;render()}
 else if(a=='add'){S.cart[v]=(S.cart[v]||0)+1;cs();nav();extra();const p=prods().find(x=>x.id==v);note('Added: '+p.n)}
 else if(a=='inc'){S.cart[v]++;cs();render()}
 else if(a=='dec'){S.cart[v]--;if(S.cart[v]<=0)delete S.cart[v];cs();render()}
 else if(a=='place'){const P=prods(),items=Object.keys(S.cart).map(i=>{const p=P.find(x=>x.id==i);return p&&{n:p.n,e:p.e,q:S.cart[i],p:p.p}}).filter(Boolean);
  if(!items.length)return;const tt=items.reduce((s,i)=>s+i.p*i.q,0);if(tt>S.u.bal){note('Not enough balance for this order.');return}const O=orders(),id='YI-'+(1001+O.length);upd(x=>{x.bal-=tt});
  O.push({id,user:S.u.u,items,total:items.reduce((s,i)=>s+i.p*i.q,0),s:0,t:Date.now(),note:$('#tb').value.trim()});sv('yi_orders',O);S.cart={};cs();S.tab='orders';render();note('Order '+id+' placed.')}
 else if(a=='adv'){const O=orders(),o=O.find(x=>x.id==v);if(o&&o.s<3){o.s++;sv('yi_orders',O);render();note(o.id+' is now '+ST[o.s]+'.')}}
 else if(a=='addp'){const n=$('#pn').value.trim(),p=+$('#pp').value;if(!n||!(p>0)){note('Enter a name and a price.');return}
  const P=prods();P.push({id:Date.now(),n,p,e:$('#pe').value.trim()||'📦',c:$('#pc').value.trim()||'Other'});sv('yi_prod',P);render();note('Added: '+n)}
 else if(a=='delp'){sv('yi_prod',prods().filter(p=>p.id!=v));render()}
 else if(a=='addu'){const u=$('#nu').value.trim(),p=$('#np').value,r=$('#nr').value,L=users();
  if(u.length<3||p.length<4){note('Username needs 3+ characters and password 4+.');return}
  if(L.some(x=>x.u.toLowerCase()==u.toLowerCase())){note('That username is taken.');return}
  L.push({u,p,r,seen:false,bal:BAL});sv('yi_users',L);render();note('Account added: '+u)}
 else if(a=='delu'){if(S.u.u!='Xyann'||v=='Xyann')return;if(S.del!=v){S.del=v;render();return}S.del=null;sv('yi_users',users().filter(x=>x.u!=v));sv('yi_cart_'+v,{});render();note('Account deleted: '+v)}
 else if(a=='savep'){const el=$('#pr'+v),n=+el.value;if(el.value===''||!(n>=0)){note('Enter a valid price.');return}const P=prods(),p=P.find(x=>x.id==v);if(p){p.p=n;sv('yi_prod',P);render();note('Price updated: '+p.n)}}
 else if(a=='thumb'){S.fb.x=$('#ft').value;S.fb.e=$('#fe').value;S.fb.t=S.fb.t==+v?0:+v;render()}
 else if(a=='star'){S.fb.x=$('#ft').value;S.fb.e=$('#fe').value;S.fb.s=+v;render()}
 else if(a=='sendfb'){const f=S.fb;f.x=$('#ft').value.trim();f.e=($('#fe').value||'').trim();if(f.e&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.e)){note('That email address does not look right.');return}if(!f.s&&!f.t&&!f.x){note('Add a rating or a few words first.');return}
  deliver('Feedback: Yann’s ItemS',(f.e?'From: '+f.e+'\n':'')+'Account: '+S.u.u+' ('+S.u.r+')\nOpinion: '+(f.t==1?'thumbs up':f.t==-1?'thumbs down':'not given')+'\nSatisfaction: '+(f.s?f.s+'/5':'not given')+'\n\nSuggestion:\n'+(f.x||'-'));S.fb={t:0,s:0,x:''};render();0}
 else if(a=='sendhelp'){const e2=$('#he').value.trim(),q=$('#hq').value.trim();S.he=e2;S.hq=q;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e2)){note('Enter a valid email address.');return}
  if(!q){note('Write your question first.');return}
  deliver('Help request: Yann’s ItemS','From: '+e2+'\nAccount: '+S.u.u+' ('+S.u.r+')\n\nQuestion:\n'+q);0}
 else if(a=='delme'){if(S.u.u=='Xyann')return;if($('#dp').value!==S.u.p){note('Wrong password.');return}const n=S.u.u;sv('yi_users',users().filter(x=>x.u!=n));sv('yi_cart_'+n,{});leave();note('Your account was deleted.')}
 else if(a=='chpw'){const c=$('#cp').value,n1=$('#np1').value,n2=$('#np2').value;
  if(c!==S.u.p){note('Current password is wrong.');return}
  if(n1.length<4){note('New password needs at least 4 characters.');return}
  if(n1!==n2){note('The new passwords do not match.');return}
  upd(x=>{x.p=n1});render();note('Password changed.')}
});

document.addEventListener('click',e=>{const b=e.target.closest('.btn,.add,.chip');
 if(b){const r=b.getBoundingClientRect(),s=document.createElement('span'),d=Math.max(r.width,r.height);s.className='rip';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),600)}
 const c=e.target.closest('.pc');if(c){c.classList.remove('tp');void c.offsetWidth;c.classList.add('tp')}
 const q=e.target.closest('.bn,.ni,.th,.st,.hb');if(q){q.classList.remove('pop');void q.offsetWidth;q.classList.add('pop')}});
document.addEventListener('input',e=>{if(e.target.id=='ft'){$('#fc').textContent=e.target.value.length+'/1000'}});
document.addEventListener('keydown',e=>{if(e.key=='Escape'){$('#dlg').hidden=true;closeMenu()}});
/* restore session */
(function(){const s=ld('yi_sess','');const x=s&&users().find(u=>u.u==s);if(x)enter(x)})();
</script>
